version: '3.8'

services:
  
  db:
    image: mysql:8.0
    container_name: mysql_Clientes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tarea2
      MYSQL_USER: Daniel
      MYSQL_PASSWORD: 1234
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  
  app:
    build: .
    container_name: php_Clientes
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: Daniel
      DB_PASSWORD: 1234
      DB_NAME: tarea2

volumes:
  db_data: